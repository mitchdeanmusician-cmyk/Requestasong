<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mitch's Dashboard</title>
<meta name="theme-color" content="#141F2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7ECE8; --surface:#FAFBF9; --surface-2:#EEF2EF; --ink:#1B2A28; --ink-2:#465753; --muted:#6F7F7A; --line:#D2DBD5;
  --accent:#2B6555; --accent-soft:#D9E8E0; --accent-ink:#FFFFFF;
  --now-bg:#23574A; --now-ink:#F0F7F3; --now-muted:#B9D4C9; --now-line:rgba(240,247,243,.28);
  --warn:#8D5B10; --warn-soft:#F3E7CF; --danger:#A33232; --danger-soft:#F4DCD8;
  --c-teaching:#4F68A6; --c-music:#86579A; --c-personal:#9A7427; --c-health:#3A8660; --c-finance:#2B7B82; --c-home:#86664F; --c-someday:#858B96;
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:20px; --r:14px; --r-sm:9px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A19; --surface:#1A2322; --surface-2:#212C2A; --ink:#E3ECE8; --ink-2:#B1C0BB; --muted:#84948F; --line:#2D3A38;
    --accent:#7DBFA9; --accent-soft:#1E3530; --accent-ink:#0F1C19;
    --now-bg:#1D3A33; --now-ink:#E7F3EE; --now-muted:#9CC1B3; --now-line:rgba(231,243,238,.22);
    --warn:#E0B060; --warn-soft:#382D1A; --danger:#E88A83; --danger-soft:#3B2220;
    --c-teaching:#8FA5DC; --c-music:#C39BD4; --c-personal:#D4B06A; --c-health:#7CC39E; --c-finance:#72C0C6; --c-home:#C7A58B; --c-someday:#A3A9B3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A19; --surface:#1A2322; --surface-2:#212C2A; --ink:#E3ECE8; --ink-2:#B1C0BB; --muted:#84948F; --line:#2D3A38;
  --accent:#7DBFA9; --accent-soft:#1E3530; --accent-ink:#0F1C19;
  --now-bg:#1D3A33; --now-ink:#E7F3EE; --now-muted:#9CC1B3; --now-line:rgba(231,243,238,.22);
  --warn:#E0B060; --warn-soft:#382D1A; --danger:#E88A83; --danger-soft:#3B2220;
  --c-teaching:#8FA5DC; --c-music:#C39BD4; --c-personal:#D4B06A; --c-health:#7CC39E; --c-finance:#72C0C6; --c-home:#C7A58B; --c-someday:#A3A9B3;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);font-weight:650;letter-spacing:-.01em;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;padding:26px 16px 20px;border-right:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:750;font-size:21px;line-height:1.15;padding:0 10px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--ink-2);font-weight:500;font-size:15px;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .count.hot{color:var(--danger);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px;font-size:13px;color:var(--muted)}
.side-foot button{background:none;border:0;padding:6px;text-align:left;color:var(--ink-2);border-radius:8px;font-size:13px}
.side-foot button:hover{background:var(--surface-2)}
.ai-status{display:flex;align-items:center;gap:8px;padding:6px}
.ai-status .dot{background:var(--muted)}
.ai-status.on .dot{background:var(--accent)}
button.ai-status{background:none;border:0;font-size:13px;color:var(--ink-2);text-align:left;border-radius:8px}
button.ai-status:hover{background:var(--surface-2)}
.when-col{flex:none;width:64px;color:var(--muted);font-size:14px;padding-top:1px;font-variant-numeric:tabular-nums}
.tl-title{font-size:15.5px}
.cal-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:14px;color:var(--muted)}
.cal-line .warn{color:var(--warn)}
.notice{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border-radius:14px;padding:12px 16px;margin:0 0 18px;font-size:15px;color:var(--ink-2)}
.cal-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cal-row small{display:block;color:var(--muted);font-size:13px}
.cal-err{color:var(--warn);font-size:13.5px;grid-column:1/-1}
.tt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;font-size:14px}
.tt b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.tt-item{padding:3px 0;line-height:1.35}
.tt-item span{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:860px){.tt{grid-template-columns:1fr 1fr}}
.teach-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.teach-log{max-height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.msg{max-width:88%;padding:11px 15px;border-radius:16px;font-size:15.5px;line-height:1.5}
.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}.msg ul{margin:4px 0 8px;padding-left:20px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.thinking{color:var(--muted)}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.idea-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.idea-card b{font-family:var(--font-display);font-weight:650;font-size:16px;line-height:1.25}
.idea-meta{font-size:13px;color:var(--muted)}
.idea-card .inline-form{margin-top:auto}
.teach-form{display:flex;gap:8px;margin-top:4px}
.teach-form .input{flex:1;font-size:16px;padding:11px 14px}
#teach-mic.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.saved-ideas{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.saved-ideas summary{cursor:pointer;color:var(--ink-2);font-weight:500}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.money>div{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.money span{font-size:13.5px;color:var(--muted)}
.money b{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.money b.warn-t{color:var(--warn)}
.money small{font-size:13.5px;color:var(--ink-2)}
.tbl tr.tot td{font-weight:600;border-bottom:0}
@media (max-width:860px){.money{grid-template-columns:1fr}}
.import-sum{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:9px 12px;margin:0 0 10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);font-weight:500}
.earn{margin:4px 0 18px}
.earn-chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.hatch{background:repeating-linear-gradient(45deg,var(--accent-soft) 0 3px,var(--accent) 3px 4px);border:1px solid var(--accent)}
.danger-link{color:var(--danger)!important}
.tbl tr.to-check td{background:var(--warn-soft)}
.receipt-drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.exp-amt{font-variant-numeric:tabular-nums;font-weight:600;min-width:74px;text-align:right;margin-top:2px}
.warn-t{color:var(--warn)}
.catbars{display:grid;gap:8px;margin-bottom:6px}
.catbars>div{display:grid;grid-template-columns:minmax(150px,1.3fr) 3fr 80px;gap:10px;align-items:center;font-size:14px}
.catbars i{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:block}
.catbars i b{display:block;height:100%;background:var(--accent);border-radius:99px}
.catbars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.sl-fold{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.sl-fold-head{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:9px 0;text-align:left;font-size:14.5px;color:var(--ink-2)}
.sl-fold-head:hover .muted{color:var(--accent)}
.sl-fold .rows{border-top:1px solid var(--line)}
.tbl tr.month-row td{padding:0;border-bottom:1px solid var(--line);background:var(--surface-2)}
.month-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;background:none;border:0;padding:10px 8px;text-align:left;font-size:14.5px;color:var(--ink)}
.month-head:hover{background:var(--accent-soft)}
.month-flags{margin-left:auto;font-size:13.5px;color:var(--ink-2)}
.chev-s{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.chev-s.open{transform:rotate(45deg)}
h2.fold-h{cursor:pointer;user-select:none;border-radius:8px}
h2.fold-h:hover .chev-p{border-color:var(--ink)}
.chev-p{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin-left:auto;align-self:center;position:relative;top:-2px}
.teach-head h2.fold-h .chev-p{margin-left:10px}
.collapsed .chev-p{transform:rotate(-45deg);top:0}
.collapsed>.panel-body{display:none}
.panel.collapsed h2,.now.collapsed h2{margin-bottom:0}
.panel.collapsed .fold-headrow,.now.collapsed .fold-headrow{margin-bottom:0}
.now .chev-p{border-color:var(--now-muted);margin-left:10px}
.now h2.fold-h{display:inline-flex;align-items:center;margin-right:12px}
.grid>.collapsed{align-self:start}
.now.collapsed{padding-bottom:22px}
div.tidy-head{display:block!important;margin-bottom:0!important}
.tidy-head h2.fold-h,.panel>h2.fold-h.tidy-head{display:flex;width:100%;margin-bottom:12px}
.tidy-head h2.fold-h .chev-p{margin-left:auto}
.panel-lead{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:0 0 12px}
.panel-lead:empty{display:none}
.panel-note{margin:0;color:var(--muted);font-size:14px}
.panel-lead .inline-form{margin-left:auto}
.mfold{border-top:1px solid var(--line)}
.mfold:first-child{border-top:0}
.mfold>.month-head{border-radius:8px}
.mfold-body{padding:4px 0 10px}
.mfold-body.block .gig{margin-top:10px}
.gig-body.one{grid-template-columns:1fr}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd{font-size:12.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-day{min-height:118px;background:var(--surface-2);border-radius:10px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day.is-wkend{background:color-mix(in srgb,var(--surface-2) 70%,var(--bg))}
.cal-day.is-past{opacity:.55}
.cal-day.is-today{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.cal-date{display:flex;align-items:baseline;gap:5px;margin-bottom:2px}
.cal-date span{display:none}
.cal-date b{font-family:var(--font-display);font-size:16px;font-weight:650}
.cal-day.is-today .cal-date b{color:var(--accent)}
.cal-date em{font-style:normal;font-size:12px;color:var(--muted)}
.cal-ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--muted);background:var(--surface);border-radius:5px;padding:3px 6px;font-size:12.5px;line-height:1.3;color:var(--ink);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
button.cal-ev:hover{background:var(--accent-soft)}
.cal-ev i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-ev.is-done{opacity:.55;text-decoration:line-through}
.k-gig{border-left-color:var(--c-music)!important}.cal-ev.k-gig{font-weight:600;background:color-mix(in srgb,var(--c-music) 14%,var(--surface))}
.k-teach{border-left-color:var(--c-teaching)!important}
.k-event,.k-rehearsal,.k-workout{border-left-color:var(--ink-2)!important}
.k-task{border-left-color:var(--warn)!important}.cal-ev.k-task{border:1px dashed var(--warn);border-left-width:3px}
.k-bill{border-left-color:var(--c-finance)!important}
.k-birthday{border-left-color:var(--c-personal)!important}
.k-holiday,.k-span{border-left-color:var(--muted)!important}.cal-ev.k-span,.cal-ev.k-holiday{background:transparent;color:var(--ink-2)}
.cal-more{font-size:12px;color:var(--muted);padding-left:4px}
.cal-legend i:not(.sw){border-left:3px solid;border-radius:2px;background:transparent!important;width:8px}
@media (max-width:860px){.cal-grid{grid-template-columns:1fr}.cal-wd{display:none}.cal-day{min-height:0}.cal-date span{display:inline;font-size:13px;color:var(--muted)}.cal-day.is-past{display:none}}
.extras{border-top:1px solid var(--line);padding-top:12px}
.extras-head{display:flex;gap:10px;align-items:baseline;margin-bottom:4px;font-size:15px}
.extras-head .muted{font-size:13.5px}
.att-fig{margin:10px 0 0}.att-fig img{max-width:100%;border-radius:10px;border:1px solid var(--line)}.att-fig figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.ex-wrap{border-top:1px solid var(--line);padding-top:10px}
.ex-row{display:grid;grid-template-columns:minmax(0,2.2fr) 70px 70px 80px auto;gap:6px;align-items:center;margin:6px 0}
.ex-row .input{padding:7px 9px;font-size:15px}
.ex-hint{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-2px}
.ex-hint:empty{display:none}
.ex-list{gap:2px 10px}
@media (max-width:860px){.ex-row{grid-template-columns:1fr 1fr 1fr 1fr auto}.ex-row [name=ex_name]{grid-column:1/-1}}
.tbl th.num{text-align:right}
.due-in{font-size:13px;color:var(--ink-2);margin-left:6px;white-space:nowrap}
.cal-ev.has-c{border-left-color:var(--ev)!important;background:color-mix(in srgb,var(--ev) 16%,var(--surface))}
.cal-ev.k-task.has-c{border-color:var(--ev)}
.cal-ev.k-span.has-c,.cal-ev.k-holiday.has-c{background:color-mix(in srgb,var(--ev) 8%,transparent)}
.gig-date.has-c{background:color-mix(in srgb,var(--ev) 20%,var(--surface));box-shadow:inset 3px 0 0 var(--ev)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.cal-legend i.sw{border:0;border-radius:3px;width:11px}
.cal-col{display:inline-flex;align-items:center;gap:6px;margin-right:8px;vertical-align:middle}
.cal-col input[type=color]{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
.cal-col .linkbtn{font-size:12.5px}
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;grid-auto-flow:row dense;margin-top:18px}
.board>section{margin:0!important;min-width:0}
.board>.collapsed{align-self:start}
.arrange-box{margin-left:auto}
.vhead .arrange-box{align-self:flex-end}
.board.arranging>section{outline:2px dashed var(--line);outline-offset:3px;cursor:grab}
.board.arranging>section.dragging{opacity:.4}
.board.arranging>section.drop-before{box-shadow:-4px 0 0 var(--accent),0 -4px 0 var(--accent)}
.board.arranging>section.drop-after{box-shadow:4px 0 0 var(--accent),0 4px 0 var(--accent)}
.tile-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 12px;padding:6px 8px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.now .tile-bar{background:rgba(255,255,255,.1);color:var(--now-ink)}
.tile-bar .grip{font-weight:600;letter-spacing:.02em;cursor:grab}
.tile-bar .seg button{padding:4px 9px;font-size:12.5px}
.now .tile-bar .seg{background:rgba(255,255,255,.12)}.now .tile-bar .seg button{color:var(--now-ink)}.now .tile-bar .seg button.on{color:var(--ink)}
@media (max-width:860px){.board{grid-template-columns:1fr}.board>section{grid-column:auto!important}}
@media (max-width:860px){
  .vhead{margin:10px 0 14px}.vhead h1{font-size:26px}
  .now-title{font-size:28px}
  .brief{font-size:16px}
  .prompts{padding-top:8px}
  .topbar{padding:12px 0 8px}
  .ask input{font-size:16px}
  .modal{padding:20px 18px;border-radius:18px;max-height:calc(100% - 10px)}
  .scrim{padding:10px;align-items:end}
  .tbl{font-size:14px}.tbl td,.tbl th{padding:8px 6px}
  .money b{font-size:22px}
  .arrange-box{display:none}
  .pv{grid-template-columns:1fr 1fr}
  .gig-actions .btn{flex:1 1 auto}
  .nav button{padding:8px 12px;font-size:14px}
}
@media (max-width:480px){.main{padding:0 12px 40px}.panel{padding:16px}.now{padding:20px 18px;border-radius:20px}.now-actions .btn{flex:1 1 auto;justify-content:center}}
.tabbar,.fab{display:none}
@media (max-width:860px){
  .side{display:none}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .prompts{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0 4px;color:var(--muted);font-size:11.5px;font-weight:500;position:relative;border-radius:12px}
  .tabbar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button[aria-current="page"] svg{stroke-width:2.3}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:41;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.25)}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .topbar{position:static}
}
.sheet-scrim{place-items:end center;padding:0}
.sheet{background:var(--surface);color:var(--ink);width:min(560px,100%);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheetup .18s ease-out}
@keyframes sheetup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 12px}
.sheet-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:none;border:0;padding:13px 8px;border-radius:12px;text-align:left;font-size:17px;color:var(--ink)}
.sheet-item:hover{background:var(--surface-2)}
.sheet-item small{font-size:13px;color:var(--muted);margin-top:2px}
.sheet-sep{height:1px;background:var(--line);margin:6px 8px}
.cap-sheet h2{font-size:22px;margin:0 0 10px}
.cap-modes{margin-bottom:10px;overflow-x:auto;flex-wrap:nowrap;max-width:100%}
.cap-modes button{white-space:nowrap}
#cap-text{font-size:17px;line-height:1.5;min-height:92px;resize:vertical}
.cap-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cap-actions .btn{flex:1 1 auto;justify-content:center;padding:12px 14px;font-size:16px}
#cap-mic.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.cap-prompts{display:flex!important;flex-wrap:wrap;padding-top:12px}
.cap-prompts button{font-size:13.5px}
.cash-tick{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);padding:0 6px}
.inv-cell{display:inline-flex;gap:8px;align-items:center}
code{font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.sl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.sl-grid textarea{font-size:15px;line-height:1.55;min-height:300px;resize:vertical}
#sl-preview{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sl-preview{list-style:none;margin:0;padding:0}
.sl-preview li{display:flex;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.sl-preview li:first-child{border-top:0}
.sl-preview .n{width:22px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.sl-preview .t{flex:1;min-width:0}
.sl-marker,.sl-marker-row{font-family:var(--font-display);font-weight:650;color:var(--c-music);padding-top:10px!important}
@media (max-width:860px){.sl-grid{grid-template-columns:1fr}}
.cl-edit{display:flex;gap:8px;width:100%;align-items:center}
.cl-edit .input{flex:1;padding:7px 10px}
.mini button[disabled]{opacity:.35;cursor:default}
.cl-tools{opacity:.55;transition:opacity .12s}
.row:hover .cl-tools,.cl-tools:focus-within{opacity:1}
.gig-list-row{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.gig-list-row .when{width:110px;flex:none;color:var(--muted);font-size:14px}

.main{min-width:0;padding:0 36px 64px}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:22px 0 12px}
.ask{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 18px;max-width:1180px}
.ask:focus-within{border-color:var(--accent)}
.ask input{flex:1;min-width:0;border:0;background:none;padding:10px 0;font-size:17px;outline:none}
.ask kbd{font:12px var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.prompts{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;max-width:1180px;scrollbar-width:none}
.prompts::-webkit-scrollbar{display:none}
.prompts button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:14px}
.prompts button:hover{background:var(--surface);color:var(--ink)}
.view{max-width:1180px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 15px;font-weight:500;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 11px;font-size:14px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ---------- Headings, panels ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:18px 0 22px;flex-wrap:wrap}
.vhead h1{font-size:34px;font-weight:750;letter-spacing:-.025em;line-height:1.1}
.vhead p{margin:6px 0 0;color:var(--ink-2);max-width:68ch}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-now{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;min-width:0}
.panel h2{font-size:19px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.panel h2 .sub{font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--muted)}
.panel h3{font-size:16px;margin:16px 0 8px}
.plain{padding:4px 0}
.empty{color:var(--muted);font-size:15px;margin:6px 0}
.muted{color:var(--muted)}
.section-gap{margin-top:18px}

/* ---------- Right now ---------- */
.now{background:var(--now-bg);color:var(--now-ink);border-radius:26px;padding:28px 32px 26px;position:relative;overflow:hidden}
.now-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;color:var(--now-muted);font-size:15px}
.now-top h2{font-family:var(--font-body);font-weight:500;font-size:15px;letter-spacing:0;color:var(--now-muted)}
.now-title{font-family:var(--font-display);font-weight:750;font-size:clamp(30px,3.3vw,44px);line-height:1.06;letter-spacing:-.03em;margin:14px 0 10px;max-width:22ch;text-wrap:balance}
.now-why{margin:0 0 20px;color:var(--now-muted);font-size:17px;max-width:60ch}
.now-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.now .btn{background:transparent;color:var(--now-ink);border-color:var(--now-line)}
.now .btn:hover{background:rgba(255,255,255,.08)}
.now .btn.primary{background:var(--now-ink);color:var(--now-bg);border-color:var(--now-ink)}
.focus-clock{font-family:var(--font-display);font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-right:6px}
.now-next{margin-top:24px;border-top:1px solid var(--now-line);padding-top:14px}
.now-next h3{font-family:var(--font-body);font-weight:500;font-size:14px;color:var(--now-muted);margin:0 0 6px}
.now-next ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.now-next li{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.now-next button{background:none;border:0;padding:5px 0;color:var(--now-ink);text-align:left;font-size:16px}
.now-next button:hover{text-decoration:underline;text-underline-offset:3px}
.now-next span{color:var(--now-muted);font-size:14px;white-space:nowrap}

.brief{font-size:18px;line-height:1.6;color:var(--ink-2);max-width:72ch;margin:0}
.brief strong{color:var(--ink);font-weight:600}
.brief .hot{color:var(--danger);font-weight:600}

/* ---------- Rows ---------- */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows > .row:first-child{border-top:0}
.check{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;display:grid;place-items:center}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.is-done .check{background:var(--accent);border-color:var(--accent)}
.is-done .check::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.is-done .row-title{text-decoration:line-through;color:var(--muted)}
.row-main{flex:1;min-width:0}
.row-title{display:block;background:none;border:0;padding:0;text-align:left;font-size:16px;line-height:1.4;color:var(--ink);width:100%}
.row-title:hover{color:var(--accent)}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:13.5px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:6px}
.pri{color:var(--danger);font-weight:500}
.chip{flex:none;font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;margin-top:1px}
.chip.danger{background:var(--danger-soft);color:var(--danger);font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn);font-weight:500}
.chip.ok{background:var(--accent-soft);color:var(--accent);font-weight:500}

/* Timeline */
.tl{display:grid;gap:14px}
.tl-day h3{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--muted);margin:0 0 4px}
.tl-item{display:flex;gap:12px;padding:5px 0;align-items:baseline}
.tl-item .when{flex:none;width:62px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item button{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-size:15.5px}
.tl-item button:hover{color:var(--accent)}
.tl-item.is-gig button{font-weight:650;color:var(--c-music)}
.tl-item .tag{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* Attention */
.att{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.att li{display:flex;gap:10px;font-size:15px;line-height:1.45}
.att li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:9px;background:var(--warn)}
.att li.high::before{background:var(--danger)}

/* Week dots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.week div{text-align:center;font-size:12.5px;color:var(--muted)}
.week i{display:block;height:34px;border-radius:9px;background:var(--surface-2);margin-bottom:4px;border:1px dashed transparent}
.week .has i{background:var(--c-health);opacity:.85}
.week .planned i{background:transparent;border:1.5px dashed var(--c-health)}
.week .today i{border-color:var(--muted)}
.bigfig{font-family:var(--font-display);font-weight:650;font-size:26px;letter-spacing:-.02em}
.spark{width:100%;height:auto;display:block}

/* Progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.low span{background:var(--danger)}
.bar.mid span{background:var(--warn)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.input, select.input, textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15.5px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--accent)}
.quick{display:flex;gap:8px;margin-bottom:18px;max-width:780px}
.quick .input{font-size:16px;padding:11px 14px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline-form .input{width:auto;flex:1;min-width:90px}

/* Inbox */
.dump{width:100%;min-height:230px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;font-size:18px;line-height:1.65;color:var(--ink)}
.dump:focus{outline:none;border-color:var(--accent)}
.dump-actions{display:flex;gap:10px;align-items:center;margin:12px 0 26px;flex-wrap:wrap}
.pv-group{margin-bottom:18px}
.pv-group h3{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pv{display:grid;grid-template-columns:minmax(0,2.4fr) 130px 150px 120px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pv .input{padding:7px 10px;font-size:15px}
.pv-note{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin-top:-2px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pv-note label{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}

/* Music */
.gig{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.gig + .gig{margin-top:12px}
.gig-list .gig + .gig{margin-top:10px}
.gig-head{cursor:pointer;border-radius:10px;margin:-6px -8px;padding:6px 8px}
.gig-head:hover{background:var(--surface-2)}
.gig.folded{padding-top:12px;padding-bottom:12px}
.gig-ready-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:4px}
.gig.open .chev{transform:rotate(45deg)}
.gig.open .gig-head{margin-bottom:4px}
.gig-head{display:grid;grid-template-columns:64px minmax(0,1fr) 170px;gap:16px;align-items:center}
.gig-date{text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0 7px;line-height:1.1}
.gig-date b{display:block;font-family:var(--font-display);font-size:24px;font-weight:750}
.gig-date span{font-size:12.5px;color:var(--muted)}
.gig-title{font-family:var(--font-display);font-size:19px;font-weight:650}
.gig-meta{font-size:14px;color:var(--muted)}
.gig-ready{font-size:14px;color:var(--ink-2)}
.gig-ready .bar{margin-top:6px}
.gig-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.gig-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.issues{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--ink-2)}
.issues li::before{content:"– ";color:var(--warn)}
.pill{white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 11px;font-size:13.5px;color:var(--ink-2)}
.pill.learning{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.rehearsing{background:var(--surface-2)}
.pill.ready{background:var(--accent-soft);color:var(--accent);border-color:transparent}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:13.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.mini{display:flex;gap:4px}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:28px;height:28px;padding:0;color:var(--ink-2);font-size:14px}
.mini button:hover{background:var(--surface-2)}

/* Units */
.unit{padding:12px 0;border-top:1px solid var(--line)}
.unit:first-of-type{border-top:0}
.unit-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.unit-top b{font-weight:600}

/* Someday */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.idea{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:transparent}
.idea p{margin:0;font-family:var(--font-display);font-weight:650;font-size:18px;line-height:1.25}
.idea .inline-form{margin-top:auto}
.project{padding:16px 0;border-top:1px solid var(--line)}
.project:first-of-type{border-top:0;padding-top:4px}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.42);z-index:50;display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);color:var(--ink);border-radius:22px;width:min(720px,100%);max-height:calc(100% - 20px);overflow:auto;padding:26px 28px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
.modal-head h2{font-size:26px;font-weight:750;letter-spacing:-.02em}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.modal-foot{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.audit-group{margin-top:18px}
.audit-group h3{font-size:17px;margin:0 0 6px}
.audit-item{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.audit-item p{margin:0;font-size:15.5px}
.audit-item .acts{display:flex;gap:6px;flex:none}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--warn);vertical-align:1px}
.sev.high{background:var(--danger)}
.sev.low{background:var(--muted)}

/* Answer */
.answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 24px;margin:6px 0 20px;max-width:1180px}
.answer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.answer-head h2{font-size:20px}
.answer-body{margin-top:10px;font-size:16px}
.answer-body p{margin:0 0 10px;max-width:72ch}
.answer-body ol,.answer-body ul{margin:6px 0 12px;padding-left:22px}
.answer-body li{margin:4px 0}
.answer-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.claude-out{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface-2);font-size:15.5px}
.claude-out p{margin:0 0 8px}
.claude-out ul{margin:4px 0 8px;padding-left:20px}
.thinking{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 14px 11px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:80;font-size:15px;max-width:min(640px,calc(100% - 32px));animation:rise .18s ease-out}
.toast button{background:none;border:0;color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Responsive ---------- */
@media (max-width:1080px){ .g-3{grid-template-columns:repeat(2,minmax(0,1fr))} .g-now{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.nav,.main{min-width:0}

function mkDate(day, mon, yr) {

function detectDate(text) {

  const rules = [
    [P + '\\b(?:today|tonight|this arvo|this afternoon|this morning|this evening)\\b', () => T],
    [P + '\\b(?:tomorrow|tmrw|tmr)\\b', () => D.add(T, 1)],
    [P + '\\b(?:this )?weekend\\b', () => D.add(T, (6 - dow + 7) % 7)],
    [P + '\\bnext week\\b', () => D.add(T, ((8 - dow) % 7) || 7)],
    [P + '\\b(?:end of (?:the )?week|eow)\\b', () => D.add(T, (5 - dow + 7) % 7)],
    [P + '\\b(?:end of (?:the )?month|eom)\\b', () => { const d = D.parse(T); return D.iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }],
    ['\\bin (\\d+|a|an|one|two|three|four|five|six) (days?|weeks?|fortnight)\\b', m => {

      const n = /\d/.test(m[1]) ? +m[1] : w[m[1]];

    [P + '\\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b', m => mkDate(+m[2], MONTHS[m[1]])],

function cleanTitle(text, strip) {
  let t = ' ' + text.trim() + ' ';
  for (const x of strip.slice().reverse()) {
    const m = t.match(new RegExp(escapeRe(x), 'i'));
    if (!m) continue;
    const after = t.slice(m.index + m[0].length);
    const hasPrep = /^(by|due|on|before|at)\b/i.test(m[0].trim());
    if (hasPrep || /^[\s.,!?;:]*$/.test(after)) t = t.slice(0, m.index) + ' ' + after;
  }
  t = t.replace(/\b(urgent|asap|important)\b|!{2,}/gi, ' ')
    .replace(/^\s*(?:i\s+)?(?:really\s+)?(?:need|needs|have|has|got|gotta|must|should)\s+(?:to\s+)?/i, ' ')
    .replace(/^\s*(?:remember|don'?t forget|reminder:?|todo:?|to do:?|note:?|idea:?)\s+(?:to\s+)?/i, ' ')
    .replace(/^\s*(?:a|an)\s+/i, ' ')
    .replace(/\s+(?:someday|some day|one day|eventually|maybe)\s*[.!?]*\s*$/i, ' ')
    .replace(/\s+/g, ' ').replace(/[\s,;:.]+$/, '').trim();

const YEAR_RE = /\b(?:year|yr|y)\s?(?:7|8|9|10|11|12)\b/g;
const KW = {
  teaching: [/\b(lesson|lessons|class|classes|assessment|assessments|marking|mark|marks|rubric|reports?|unit|units|students?|school|curriculum|syllabus|worksheets?|parents?|staff|faculty|excursion|prac|teach|teaching|term|semester|homework|quiz|exams?|period)\b/g, YEAR_RE],
  music: [/\b(gigs?|rehears\w*|setlists?|songs?|guitars?|strings|amp|pa|pedals?|band|venue|chords?|tabs?|mics?|drums?|bass|ep|album|soundcheck|busk\w*|capo|picks|ukulele|piano|keys|vocals|covers?|jam|studio|mixing)\b/g],
  finance: [/\b(invoices?|pay|paid|bills?|tax|bank|budget|super|rego|insurance|refund|receipts?|bas|abn|rent|mortgage|loan|quote|payment)\b/g],
  health: [/\b(workouts?|gym|run|running|walk|weigh|weight|dentist|doctor|gp|physio|meals?|diet|stretch\w*|yoga|sleep|protein|swim|bike|cycling|fitness|exercise|steps|chiro|optometrist)\b/g],
  home: [/\b(clean\w*|laundry|fix|mow|garden\w*|bins|dishes|vacuum|repair|gutters?|lawn|fridge|groceries|grocery|house|tap|lightbulb|plumber|electrician|sweep|tidy|declutter|pantry|milk|bread|coffee|eggs|car|service)\b/g],
  personal: [/\b(birthday|mum|dad|mom|gift|present|friends?|haircut|dinner|party|wedding|holiday|trip|passport|licence|license|movie)\b/g]

function scoreCats(s, only) {
  let best = null, bs = 0;
  for (const [c, res] of Object.entries(KW)) {
    if (only && !only.includes(c)) continue;

    for (const re of res) sc += (s.match(re) || []).length * (re === YEAR_RE ? 2 : 1);

function detectPriority(s, due, type) {

  if (/\b(someday|maybe|eventually|low priority|whenever)\b/i.test(s) || type === 'idea') return 3;

    if (n <= 1) return 1;
    if (n <= 3 && ['assessment', 'invoice', 'bill', 'rehearsal'].includes(type)) return 1;

}
function venueWords(g) {

}
function venueMentioned(g, s) { return venueWords(g).some(w => new RegExp('\\b' + escapeRe(w) + '\\b').test(s)); }

function linkGig(item, s) {
  const st = S();
  const up = st.gigs.filter(g => D.diff(g.date) >= 0).sort(byDate);
  if (item.type === 'invoice') {
    const past = st.gigs.filter(g => D.diff(g.date) < 0 && !g.invoiced).sort(byDate);
    const g = st.gigs.find(g => venueMentioned(g, s)) || past[past.length - 1] || up[0];
    if (g) {
      item.gigId = g.id;
      if (/\bvenue\b/i.test(item.title) || item.title.split(' ').length <= 2) item.title = `Invoice ${g.venue}`;
      if (!item.due) item.due = D.diff(g.date) < 0 ? D.today() : D.add(g.date, 1);

  }
  if (item.category !== 'music' || item.type === 'song' || item.type === 'gig') return;

  if (!g && item.due) g = up.find(g => g.date === item.due && D.diff(g.date) <= 14);
  if (!g && /\b(gig|set|setlist|show)\b/.test(s)) g = up.find(g => D.diff(g.date) <= 14);

}

/** Turn one messy line into a structured item. Pure apart from reading gigs for linking. */
function parseThought(raw, opts = {}) {
  const text = String(raw).replace(/^\s*(?:[-*•–]|\d+[.)])\s*/, '').trim();
  if (!text) return null;

  const { date, time, strip } = detectDate(text);
  const item = { raw: text, title: cleanTitle(text, strip) || cap(text), category: null, type: 'task', due: date, time,
    priority: 2, estimate: null, notes: '', suggestProject: false, makeProject: false, songTitle: null, gigId: null, gigDraft: null };
  let m;
  if (/\binvoice\b/.test(s) && /\b(venue|gig|band|pub|hotel|bar|caf[eé]|brewery|wedding|club)\b/.test(s)) { item.category = 'music'; item.type = 'invoice'; }
  else if ((m = text.match(/^\s*(?:learn|learning|work out|figure out)\s+(?:how to play\s+)?(.+)$/i))) {
    const rest = m[1].replace(/[.!]+$/, '').trim();

    else { item.category = 'music'; item.type = 'song'; item.songTitle = cap(rest.replace(/\s+by\s+.+$/i, '').replace(/\s+(solo|properly|for .+)$/i, '')); item.title = `Learn ${item.songTitle}`; }
  }
  else if (/\b(gig|show|playing)\b/.test(s) && /\bat\s+(?:the\s+)?[A-Z]/.test(text) && !/\b(rehears|prep|pack|invoice|practi[cs]e)/.test(s)) { item.category = 'music'; item.type = 'gig'; }
  else if (/\brehears|\bpractise (the )?set|\brun[- ]through\b/.test(s)) { item.category = 'music'; item.type = 'rehearsal'; }
  else if (/\b(book|make|schedule|ring)\b.*\b(dentist|doctor|gp|physio|appointment|appt|haircut|optometrist|vet|mechanic|service|chiro|skin check|blood test|massage)\b/.test(s) || /\b(dentist|doctor|gp|physio|optometrist)\b/.test(s)) {
    item.type = 'appointment';
    item.category = /\b(dentist|doctor|gp|physio|optometrist|chiro|skin check|blood test|massage)\b/.test(s) ? 'health' : (/\b(car|mechanic|service)\b/.test(s) ? 'home' : 'personal');
  }
  else if (/\bbirthday\b|\bbday\b/.test(s) && !/\b(buy|get|gift|present|card)\b/.test(s)) { item.category = 'personal'; item.type = 'birthday'; }

    item.suggestProject = true;

    else if (/\b(lesson|lessons)\b/.test(s)) item.type = 'lesson';
    else if (/\b(assessment|mark|marking|rubric|exam|quiz|reports?|grade|grading|feedback)\b/.test(s)) item.type = 'assessment';
    else if (/\b(worksheet|resource|slides|handout|chart|video|playlist|task sheet|template)\b/.test(s)) item.type = 'resource';

  if (item.type === 'lesson' && !/^(plan|write|prep|prepare|create|make|finish|teach|draft|review|redo)\b/i.test(item.title)) {

  item.estimate = defaultEstimate(item.type, item.title);
  return item;
}

function destinationFor(p) {

/* --- Scoring: "What should I work on right now?" --- */
function makeCtx(minutes) {
  const d = new Date(), T = D.today(), now = D.nowHM();
  const next = todaysCommitments(T).filter(e => e.time && e.time > now)[0] || null;
  const untilMin = next ? (+next.time.slice(0, 2) * 60 + +next.time.slice(3)) - (d.getHours() * 60 + d.getMinutes()) : null;
  return { today: T, hour: d.getHours(), dow: d.getDay(), minutes: minutes || null, hols: schoolHoliday(T), next, untilMin };
}
function scoreTask(t, ctx) {
  const why = [];
  let sc = 0;
  if (!isActionable(t)) return { t, score: -999, why };
  if (t.snoozed === ctx.today) return { t, score: -500, why: ['snoozed for today'] };
  if (t.due) {
    const n = D.diff(t.due);
    if (n < 0) { sc += 60 + Math.min(-n * 4, 30); why.push(`overdue by ${plural(-n, 'day')}`); }
    else if (n === 0) { sc += 48; why.push('due today'); }
    else if (n === 1) { sc += 34; why.push('due tomorrow'); }
    else if (n <= 3) { sc += 24; why.push(`due ${D.label(t.due)}`); }
    else if (n <= 7) sc += 10;
  }
  if (t.priority === 1) { sc += 28; why.push('high priority'); } else if (t.priority === 2) sc += 10;
  if (t.gigId) { const g = gigById(t.gigId); if (g) { const n = D.diff(g.date); if (n >= 0 && n <= 5) { sc += 18; why.push(`your ${g.venue} gig is ${D.rel(g.date)}`); } } }
  const weekday = ctx.dow >= 1 && ctx.dow <= 5;
  if (t.category === 'teaching') {
    if (ctx.hols) { if (!t.due || D.diff(t.due) > 3) sc -= 12; }
    else { if (weekday && ctx.hour >= 7 && ctx.hour < 16) { sc += 8; why.push("it's school hours"); } if (!weekday) sc -= 4; }
  }
  if (t.category === 'music' && (ctx.hour >= 16 || !weekday)) sc += 5;
  const est = t.estimate || 25;
  if (est <= 15) { sc += 4; if (why.length < 2) why.push('a quick win'); }
  if (ctx.minutes && est > ctx.minutes) sc -= 12;
  if (ctx.untilMin != null && ctx.untilMin > 0 && est > ctx.untilMin) sc -= 10;
  if (!t.due && t.createdAt && D.diff(t.createdAt) < -14) { sc += 6; if (why.length < 2) why.push(`it's been waiting ${-D.diff(t.createdAt)} days`); }
  return { t, score: sc, why };
}
const rankTasks = ctx => S().tasks.map(t => scoreTask(t, ctx)).filter(r => r.score > -100).sort((a, b) => b.score - a.score);

/* --- Gig readiness --- */
function gigReadiness(g) {
  const issues = [];
  if (g.missing) issues.push('No longer in your Google Calendar. Delete it here if it was cancelled.');
  const tasks0 = () => S().tasks.filter(t => t.gigId === g.id && t.status === 'todo');
  if (isHosting(g)) {
    const cl = g.checklist || [], left = cl.filter(c => !c.done).length;
    if (left) issues.push(`${plural(left, 'checklist item')} left`);
    return { pct: cl.length ? Math.round((cl.length - left) / cl.length * 100) : 0, issues, reh: 0, notReady: [], tasks: tasks0(),
      hasChecklist: cl.length > 0, hasSetlist: true, hosting: true };
  }
  let score = 0;
  const cr = calRehearsalsFor(g);
  const rehDates = new Set((g.rehearsals || []).filter(r => D.diff(r) <= 0 && D.diff(r) >= -30).concat(cr.done.map(x => x.date)));
  const reh = rehDates.size;
  score += Math.min(reh, 2) / 2 * 35;
  if (cr.booked.length && reh < 2) issues.push(`Rehearsal booked ${D.label(cr.booked[0].date)}${cr.booked[0].time ? ' ' + D.time(cr.booked[0].time) : ''}`);
  else if (reh === 0) issues.push('No rehearsal logged yet'); else if (reh === 1) issues.push('Only one rehearsal logged');
  const sl = g.setlistId && setlistById(g.setlistId);
  let notReady = [];
  if (!sl || !sl.songIds.length) issues.push('No setlist yet');
  else {
    score += 10;
    const songs = sl.songIds.map(songById).filter(Boolean);
    notReady = songs.filter(x => x.status !== 'ready');
    score += songs.length ? (songs.length - notReady.length) / songs.length * 35 : 0;
    if (notReady.length) issues.push(`${plural(notReady.length, 'song')} not gig-ready: ${notReady.map(x => x.title).join(', ')}`);
  }
  const cl = g.checklist || [];
  if (cl.length) { const left = cl.filter(c => !c.done).length; score += (cl.length - left) / cl.length * 20; if (left) issues.push(`${plural(left, 'checklist item')} left`); }
  const tasks = S().tasks.filter(t => t.gigId === g.id && t.status === 'todo');
  return { pct: Math.round(score), issues, reh, notReady, tasks, hasChecklist: cl.length > 0, hasSetlist: !!(sl && sl.songIds.length) };
}
const upcomingGigs = () => S().gigs.filter(g => D.diff(g.date) >= 0).sort(byDate);

/* --- Life audit --- */
function lifeAudit() {
  const st = S(), out = [];
  const add = (group, sev, text, actions = []) => out.push({ group, sev, text, actions });
  const open = openTasks();
  // Overdue
  const overdue = open.filter(t => t.due && D.diff(t.due) < 0 && isActionable(t));
  const byCat = {};
  overdue.forEach(t => (byCat[t.category] = byCat[t.category] || []).push(t));
  Object.entries(byCat).forEach(([c, arr]) => {
    if (arr.length > 1) add('Overdue', 'high', `${numWord(arr.length)} ${CATS[c].toLowerCase()} tasks are overdue.`);
    arr.forEach(t => add('Overdue', 'high', `${t.title}, ${plural(-D.diff(t.due), 'day')} late.`, [{ label: 'Done', action: 'toggle-task', id: t.id }, { label: 'Reschedule', action: 'open-task', id: t.id }]));
  });
  // Missing preparations
  upcomingGigs().filter(g => D.diff(g.date) <= 14).forEach(g => {
    const r = gigReadiness(g), when = D.rel(g.date);
    const parts = [], acts = [];
    if (r.reh === 0 && !r.hosting && !calRehearsalsFor(g).booked.length) { parts.push('no rehearsal logged'); acts.push({ label: 'Log rehearsal', action: 'gig-rehearse', id: g.id }); }
    if (!r.hasSetlist) parts.push('no setlist');

const COMMAND_HANDLERS = [

const SKIP = Symbol('skip');

/* "What to work on right now": tasks (gig prep checklists left out), invoices once a gig

function rankNow(ctx) {

    const r = scoreTask(t, ctx); if (r.score <= 0) return;

  });

      && !st.tasks.some(t => t.gigId === g.id && t.type === 'invoice' && t.status === 'todo'))
    .forEach(g => out.push({ kind: 'invoice', key: 'inv:' + g.id, id: g.id, title: `Invoice ${venueBaseName(g.venue)}`, category: 'music', estimate: 5,
      score: 58 + Math.min(-D.diff(g.date) * 3, 30), why: [`you played there ${D.rel(g.date)}`, gigFee(g) != null ? `${aud(gigFee(g))} to claim` : 'add the fee first'] }));

    const g = inSet.get(s.id), learning = s.status === 'learning', why = [];
    let sc = learning ? 16 : 12;
    if (g) { sc += D.diff(g.date) <= 7 ? 26 : 14; why.push(`it's in your set for ${venueBaseName(g.venue)} ${D.rel(g.date)}`); }
    why.push(learning ? "you're still learning it" : "you're rehearsing it");

function cmdPlan(minutes) {

  if (!ranked.length) return { title: `Your next ${minutes} minutes`, html: '<p>Nothing pressing. A good time for a Someday idea, some practice, or a workout.</p>' };

  for (const r of ranked) {

  if (first.estimate > minutes) lead += ` It's a bigger job (about ${first.estimate} minutes), so spend the whole ${minutes} minutes on it and stop at a clean point.`;
  const items = plan.map(r => `<li><button class="linkbtn" ${nowAction(r)}>${esc(r.title)}</button> <span class="muted">about ${r.estimate} min${r.why.length ? ', ' + esc(r.why[0]) : ''}</span></li>`).join('');

/* ---------- Weekly timetable: blocks on a grid you can add, colour, drag and resize ---------- */
const TT_COLOURS = ['#4F68A6', '#86579A', '#2B7B82', '#3A8660', '#B7791F', '#C2410C', '#A33232', '#6B7280'];
const toMin = t => { const [a, b] = String(t || '0:0').split(':').map(Number); return a * 60 + (b || 0); };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const TT_PX = 1.6;   // pixels per minute (roomier, so short classes stay readable)
function ttRange() {
  const tt = S().timetable; let lo = 8 * 60, hi = 15 * 60 + 30;
  tt.forEach(c => { lo = Math.min(lo, toMin(c.time)); hi = Math.max(hi, toMin(c.end || toHM(toMin(c.time) + 60))); });
  return { lo: Math.floor(lo / 60) * 60, hi: Math.ceil(hi / 60) * 60 };
}
function timetableGrid() {
  const tt = S().timetable, { lo, hi } = ttRange(), H = (hi - lo) * TT_PX, today = new Date().getDay(), nowM = new Date().getHours() * 60 + new Date().getMinutes();
  const hours = []; for (let m = lo; m <= hi; m += 60) hours.push(m);
  const block = c => {
    const s = toMin(c.time), e = toMin(c.end || toHM(s + 60)), col = c.color || TT_COLOURS[0];
    return `<div class="tt-block ${e - s < 40 ? 'short' : ''}" data-tt="${c.id}" style="top:${(s - lo) * TT_PX}px;height:${Math.max(26, (e - s) * TT_PX)}px;--c:${col}" title="${esc(c.title)}, ${D.time(c.time)} to ${D.time(toHM(e))}">
      <b>${esc(c.title)}</b><span>${D.time(c.time)}–${D.time(toHM(e))}</span><i class="tt-resize" aria-hidden="true"></i></div>`;
  };
  return `<div class="tt-wrap"><div class="tt-grid" style="--h:${H}px">
    <div class="tt-times">${hours.map(m => `<span style="top:${(m - lo) * TT_PX}px">${D.time(toHM(m))}</span>`).join('')}</div>
    ${[1, 2, 3, 4, 5].map(d => `<div class="tt-col ${d === today ? 'is-today' : ''}" data-day="${d}"><div class="tt-day">${['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'][d]}</div>
      <div class="tt-slots" data-day="${d}" style="height:${H}px">${hours.slice(0, -1).map(m => `<i style="top:${(m - lo) * TT_PX}px"></i>`).join('')}
        ${d === today && nowM > lo && nowM < hi ? `<em class="tt-now" style="top:${(nowM - lo) * TT_PX}px"></em>` : ''}

const WORKOUT_KINDS = ['Weights', 'Cardio', 'Walking', 'Hiking', 'Run', 'Swim', 'Bike', 'Yoga', 'Sport', 'Other', 'Rest day'];
const DIST_KINDS = /^(cardio|walking|walk|hiking|hike|run|swim|bike|cycling)$/i;
const LIFT_KINDS = /^(weights|gym|other)$/i;
const kindOpts = sel => [...new Set(WORKOUT_KINDS.concat(sel && !WORKOUT_KINDS.includes(sel) ? [sel] : []))].map(k => `<option ${k === sel ? 'selected' : ''}>${esc(k)}</option>`).join('');
const HIKE_DIFFICULTY = ['Easy', 'Moderate', 'Hard', 'Very hard'];
const ELEV_KINDS = /^(hiking|hike|walking|walk|run|bike|cycling)$/i;
const workoutText = w => w.rest ? '😴 Rest day' : `${esc(w.type === 'Gym' ? 'Weights' : w.type)}${w.trail ? `: ${esc(w.trail)}` : ''}, ${w.minutes} min${w.km ? `, ${w.km} km` : ''}${w.elev ? `, ${w.elev} m up` : ''}${w.difficulty ? `, ${esc(w.difficulty)}` : ''}`;
/** Trail name, elevation, difficulty and link fields (shown for hikes, walks, runs and rides). */
const trailFields = (w = {}) => `
  <label class="field wo-trail">Trail or route<input class="input" name="trail" value="${esc(w.trail || '')}" placeholder="e.g. Mt Tibrogargan summit"></label>
  <label class="field wo-trail">Elevation gain (m)<input class="input" name="elev" type="number" min="0" max="9000" step="1" value="${w.elev ?? ''}" placeholder="e.g. 364"></label>
  <label class="field wo-hike">Difficulty<select class="input" name="difficulty"><option value="">Not set</option>${HIKE_DIFFICULTY.map(d => `<option ${w.difficulty === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
  <label class="field wo-hike">AllTrails link<input class="input" name="link" type="url" value="${esc(w.link || '')}" placeholder="https://www.alltrails.com/…"></label>`;
/** Reads the trail fields from a workout form. */
function readTrail(f, type) {
  const g = n => f.elements[n] ? f.elements[n].value.trim() : '';
  if (!ELEV_KINDS.test(type)) return { trail: undefined, elev: undefined, difficulty: undefined, link: undefined };
  const hike = /^(hiking|hike)$/i.test(type);
  return { trail: g('trail') || undefined, elev: g('elev') === '' ? undefined : Math.max(0, Math.round(+g('elev'))), difficulty: hike && g('difficulty') || undefined, link: hike && /^https?:\/\//.test(g('link')) ? g('link') : undefined };
}
function copyWorkout(id) {

  setTimeout(() => {
    const f = $('form[data-form=workout]'); if (!f) return;
    const kind = w.type === 'Gym' ? 'Weights' : w.type;

/** Reads fortnight blocks from the Excel budget (rows as a grid of cell values). */
function parseBudgetSheet(rows, today) {
  const txt = v => typeof v === 'string' ? v.trim() : '';
  const num = v => typeof v === 'number' ? v : (typeof v === 'string' && v.trim() !== '' && !isNaN(+v.replace(/[$,\s]/g, '')) ? +v.replace(/[$,\s]/g, '') : null);
  const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  const toDate = label => {
    const m = String(label).toLowerCase().match(/(\d{1,2})\s*(?:st|nd|rd|th)?\s+([a-z]+)/); if (!m) return null;
    const mi = MONTHS.findIndex(x => x.startsWith(m[2].slice(0, 3))); if (mi < 0) return null;
    const t = D.parse(today || D.today()); let y = t.getFullYear();
    let d = new Date(y, mi, +m[1]); if (d - t > 60 * 864e5) d = new Date(y - 1, mi, +m[1]);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const out = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r] || [];
    for (let c = 0; c < row.length; c++) {
      if (!/^income$/i.test(txt(row[c])) || !/budget/i.test(txt(row[c + 2]))) continue;
      let label = ''; for (let k = r - 1; k >= 0 && !label; k--) label = txt((rows[k] || [])[c]);
      const start = toDate(label); if (!start) continue;
      const fn = { id: uid('fn'), start, income: [], items: [], imported: label };
      let sec = null;
      for (let k = r + 1; k < rows.length; k++) {
        const R = rows[k] || [], name = txt(R[c]), lab2 = txt(R[c + 2]);
        if (/^(total income|total expenses|remaining)$/i.test(lab2)) break;
        if (!name) continue;
        if (/^t\w{1,4}l\s+income$/i.test(name)) { sec = 'gap'; continue; }   // "TOTAL income" (or "TOAL income")
        if (/core/i.test(name) && /fixed/i.test(name)) { sec = 'fixed'; continue; }
        if (/variable/i.test(name)) { sec = 'variable'; continue; }
        if (/seasonal|upcoming/i.test(name)) { sec = 'seasonal'; continue; }
        if (/^total$/i.test(name)) continue;
        if (!sec) { fn.income.push({ id: uid('bi'), name, amount: r2(num(R[c + 1]) || 0) }); continue; }
        if (sec === 'gap') continue;
        const b = num(R[c + 2]), s = num(R[c + 3]), t = num(R[c + 4]), a = num(R[c + 5]);
        if ([b, s, t, a].every(x => x == null)) continue;
        const auto = Math.max(0, r2((b || 0) - (s || 0)));
        fn.items.push({ id: uid('bb'), sec, name, budget: r2(b || 0), saved: r2(s || 0), transferred: t == null || Math.abs(t - auto) < 0.005 ? null : r2(t), actual: a == null ? null : r2(a) });
      }
      out.push(fn);
    }
  }
  return out;
}

    if (!found.length) { toast('Couldn’t find any fortnights in that file. It needs "Income" and "Budget Per FN" headings like your budget sheet.'); return; }

/* dragging stickies: pointer events work for mouse, pen and finger */
let stDrag = null;
function stPointerDown(ev) {
  const el = ev.target.closest && ev.target.closest('.sticky'); if (!el || ev.button > 0) return;
  const n = boards().notes.find(x => x.id === el.dataset.sticky); if (!n) return;
  stDrag = { id: n.id, el, x0: ev.clientX, y0: ev.clientY, nx: n.x || 0, ny: n.y || 0, moved: false, pid: ev.pointerId };
  const z = Math.max(0, ...boards().notes.map(x => x.z || 0)) + 1; el.style.zIndex = z; n.z = z;
}
function stPointerMove(ev) {
  if (!stDrag) return;
  const dx = ev.clientX - stDrag.x0, dy = ev.clientY - stDrag.y0;
  if (!stDrag.moved && Math.hypot(dx, dy) < 6) return;
  if (!stDrag.moved) { stDrag.moved = true; stDrag.el.classList.add('dragging'); try { stDrag.el.setPointerCapture(stDrag.pid); } catch (e) {} }
  ev.preventDefault();
  const canvas = $('#board-canvas'), maxX = canvas ? canvas.scrollWidth - STICKY_W : 2000;
  const nx = Math.max(0, Math.min(maxX, stDrag.nx + dx)), ny = Math.max(0, stDrag.ny + dy);
  stDrag.el.style.left = nx + 'px'; stDrag.el.style.top = ny + 'px'; stDrag.px = nx; stDrag.py = ny;
  if (canvas && ny + 240 > canvas.offsetHeight) canvas.style.height = (ny + 260) + 'px';
  document.querySelectorAll('.folder-tab.drop').forEach(t => t.classList.remove('drop'));
  const tab = document.elementsFromPoint(ev.clientX, ev.clientY).find(e => e.classList && e.classList.contains('folder-tab') && e.dataset.folder);
  if (tab && tab.dataset.folder !== canvas?.dataset.folder) { tab.classList.add('drop'); stDrag.dropFolder = tab.dataset.folder; } else stDrag.dropFolder = null;
}
function stPointerUp() {
  if (!stDrag) return;
  const d = stDrag; stDrag = null;
  const n = boards().notes.find(x => x.id === d.id); if (!n) return;
  document.querySelectorAll('.folder-tab.drop').forEach(t => t.classList.remove('drop'));
  if (!d.moved) { Store.save(); openSticky(n.id); return; }
  if (d.dropFolder) { const f = boards().folders.find(x => x.id === d.dropFolder); n.folderId = d.dropFolder; n.x = 16; n.y = 16; commit(); toast(`Moved to ${f ? f.name : 'project'}`); return; }
  n.x = Math.round(d.px ?? n.x); n.y = Math.round(d.py ?? n.y); Store.save(); d.el.classList.remove('dragging');
}

/* --- Answer panel --- */
function formatClaude(text) {
  const lines = String(text || '').split('\n');
  let html = '', inList = false;
  for (const raw of lines) {
    const l = raw.trim();
    if (/^[-•*]\s+/.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${esc(l.replace(/^[-•*]\s+/, '').replace(/\*\*/g, ''))}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (l) html += `<p>${esc(l.replace(/\*\*/g, ''))}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}
function showAnswer(a, q) {
  lastAnswer = { ...a, q };
  const acts = (a.actions || []).map(x => `<button class="btn small" data-action="${x.action}" ${x.id ? `data-id="${x.id}"` : ''} ${x.view ? `data-view="${x.view}"` : ''}>${esc(x.label)}</button>`).join('');
  $('#answer').innerHTML = `<section class="answer" aria-live="polite">
    <div class="answer-head"><div><p class="muted" style="margin:0 0 2px;font-size:14px">${esc(q || '')}</p><h2>${esc(a.title)}</h2></div><button class="btn small ghost" data-action="answer-close">Close</button></div>
    <div class="answer-body">${a.html}</div>
    ${acts || AI.ready ? `<div class="answer-foot">${acts}${AI.ready && q ? `<button class="btn small" data-action="ask-claude" data-q="${esc(q)}">Ask Claude for a deeper take</button>` : ''}</div>` : ''}
    <div id="claude-out"></div></section>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
let claudeCtl = null;
async function askClaude(q, targetSel) {
  if (!AI.ready) return;
  const out = $(targetSel || '#claude-out');
  if (!out) return;
  claudeCtl?.abort();
  claudeCtl = new AbortController();
  out.innerHTML = `<div class="claude-out"><p class="thinking">Thinking…</p><button class="btn small ghost" data-action="claude-stop">Stop</button></div>`;
  try {
    await AI.ask(q, ({ text }) => { const box = out.querySelector('.claude-out'); if (box) box.innerHTML = formatClaude(text) + '<button class="btn small ghost" data-action="claude-stop">Stop</button>'; }, claudeCtl.signal)
      .then(({ text }) => { out.innerHTML = `<div class="claude-out">${formatClaude(text)}</div>`; });
  } catch (e) {
    out.innerHTML = `<div class="claude-out">${e && e.text ? formatClaude(e.text) : ''}<p class="muted">${esc(AI.errorCopy(e))}</p></div>`;
  }
}

/* --- Toast / undo --- */
let toastTimer = null;
function toast(msg, undoSnap) {
  clearTimeout(toastTimer);
  $('#toast-root').innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undoSnap ? '<button data-action="undo">Undo</button>' : ''}</div>`;
  $('#toast-root').dataset.snap = undoSnap || '';
  toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; $('#toast-root').dataset.snap = ''; }, 6000);
}
const offerUndo = (msg, snap) => toast(msg, snap);

/* --- Focus timer --- */
let focusInt = null;
function tickFocus() {
  clearInterval(focusInt);
  if (!focus) return;
  const upd = () => {
    const el = $('#focus-clock'); if (!el) return;
    const left = Math.max(0, focus.endsAt - Date.now());
    el.textContent = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left / 1000) % 60)}`;
    if (left <= 0) { clearInterval(focusInt); toast('Focus session finished. Take a short break.'); focus = null; render(); }
  };
  upd(); focusInt = setInterval(upd, 1000);
}

/* ---------- 7. Actions ---------- */
function commit() { Store.save(); render(); }
function go(view) {
  arranging = false;
  if (dictation) dictation.stop(); VIEW = view; history.replaceState(null, '', '#' + view); closeOverlay(); render(); window.scrollTo({ top: 0 }); }

function completeTask(t) {
  const st = S();
  if (t.status === 'done') { t.status = 'todo'; t.doneAt = null; return `Reopened "${t.title}"`; }
  t.status = 'done'; t.doneAt = D.today();
  const g = t.gigId && gigById(t.gigId);
  if (g && t.type === 'rehearsal') g.rehearsals.push(D.today());
  if (g && t.type === 'invoice') { g.invoiced = true; g.invoicedAt = D.today(); }
  if (t.projectId) { const p = (st.projects || []).find(p => p.id === t.projectId); if (p) { p.lastActivity = D.today(); const s = p.steps.find(s => s.text === t.title); if (s) s.done = true; } }
  if (t.category === 'teaching') { const u = st.units.find(u => t.title.toLowerCase().includes(u.name.toLowerCase().split(' ').slice(0, 2).join(' '))); if (u) u.lastActivity = D.today(); }
  if (focus && focus.id === t.id) focus = null;
  return `Done: ${t.title}`;
}

  document.addEventListener('dragover', e => { if (expDraft && e.target.closest && e.target.closest('#exp-modal')) e.preventDefault(); });
  document.addEventListener('drop', e => { if (expDraft && e.target.closest && e.target.closest('#exp-modal')) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) expReceiptChosen(f); } });
  document.addEventListener('dragover', e => { if (setImport && e.target.closest && e.target.closest('#sl-modal')) e.preventDefault(); });
  document.addEventListener('drop', e => { if (setImport && e.target.closest && e.target.closest('#sl-modal')) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) setlistImportFile(f); } });
  document.addEventListener('change', e => {
    if (e.target.name === 'ex_name') { const row = e.target.closest('.ex-row'), last = lastLift(e.target.value), hint = row && row.querySelector('.ex-hint');
      if (hint) hint.textContent = last ? `Last time: ${exText(last)} (${D.label(last.date)})` : '';
      if (last && row) { ['sets', 'reps', 'kg'].forEach(k => { const i = row.querySelector(`[name=ex_${k}]`); if (i && i.value === '' && last[k] != null) i.value = last[k]; }); } }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'sl-text' && setImport) { setImport.text = e.target.value; clearTimeout(window.__slT); window.__slT = setTimeout(() => { const p = $('#sl-preview'); if (p) p.innerHTML = setlistPreviewHtml(); }, 150); }
  });
  $('#import-file').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try { const s = JSON.parse(r.result); if (!s || s.version !== 1 || !Array.isArray(s.tasks)) throw new Error('bad'); const snap = Store.snapshot(), meta = S().meta; Store.state = migrate(s); Store.state.meta = meta; if (Sync.enabled()) Sync.pending = true; commit(); if (Sync.enabled()) Sync.push(true); toast('Backup imported', snap); }
      catch (err) { toast('That file isn’t a Mitch’s Dashboard backup. Choose a .json file made with Export.'); }
    };
    r.readAsText(file); e.target.value = '';
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'cap-text' && !/\n/.test(e.target.value) && capMode !== 'shop') { e.preventDefault(); captureSave(); return; }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); ACTIONS[e.target.dataset.enter](e.target); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-action]')) { e.preventDefault(); e.target.click(); return; }
    if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); $('#ask').focus(); }
    if (e.key === 'Escape' && clEdit) { clEdit = null; render(); return; }
    if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeOverlay(); else if ($('#answer').innerHTML) $('#answer').innerHTML = ''; }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement.id === 'dump') ACTIONS['sort-dump']();
  });
  document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !viewBusy()) safeRender(); }, 60));
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v) && v !== VIEW) { VIEW = v; render(); } });
  // Re-render at midnight-ish and every 10 minutes so "today" and scoring stay fresh
  setInterval(() => {
    if (Cal.available && S().calendar.enabled && Cal.watchDay !== D.today()) Cal.startWatches();   // new day, new window
    if (!document.querySelector('.modal')) safeRender();
  }, 10 * 60000);
  AI.init();
  Cal.init();
  registerServiceWorker();
  setTimeout(consumeShare, 300);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Feed.active() && Date.now() - (Cal.lastSynced() || 0) > 60000) Feed.sync();
  });
}
if (typeof document !== 'undefined' && document.getElementById('view')) boot();
</script>
